name: Account isolation repair validation
on:
  push:
    branches: [fix/account-isolation-mcp-20261028]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: account-isolation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - name: Materialize reviewed source repair on feature branch only
        id: source
        env:
          REPAIR_BRANCH: fix/account-isolation-mcp-20261028
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$REPAIR_BRANCH"
          if test -f .maintenance/account-isolation/apply.py; then
            python3 .maintenance/account-isolation/apply.py
            git add app desktop
            git rm -r .maintenance/account-isolation
            git -c user.name='Vortex repair validation' -c user.email='actions@users.noreply.github.com' commit -m 'Isolate verified account workspaces and credentials; add MCP authentication settings and scrolling'
            git push origin "HEAD:refs/heads/$REPAIR_BRANCH"
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  desktop:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Go account and desktop regression tests
        working-directory: desktop
        run: go test ./... -count=1 -timeout=8m
      - name: Frontend regression tests
        shell: bash
        run: node --test desktop/frontend/*.test.cjs
      - name: Export source and dependencies for offline review
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p review
          (cd desktop && go mod vendor)
          tar --exclude=.git --exclude=review --exclude=.build -cf review/vortex-review.tar app desktop gateway scripts
          git rev-parse HEAD > review/COMMIT.txt
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux'
        with:
          name: vortex-isolation-reviewed-source
          path: review/
          retention-days: 3
  macos:
    needs: source
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - name: Swift native build and regression tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p review
          swift test --package-path app -j 2 2>&1 | tee review/swift-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vortex-isolation-macos-test-results
          path: review/
          retention-days: 3
