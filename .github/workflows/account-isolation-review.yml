name: Account isolation repair validation
on:
  push:
    branches: [fix/account-isolation-mcp-20261028]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: account-isolation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Account isolation, credentials and MCP transports
        working-directory: desktop
        run: go test ./... -count=1 -timeout=8m
      - name: Frontend regression tests
        shell: bash
        run: node --test desktop/frontend/*.test.cjs
      - name: Package current desktop and verifier
        shell: bash
        env:
          VORTEX_VERSION: '2.12.1'
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then target=windows; else target=linux; fi
          bash scripts/build-desktop-with-helper.sh "$target" amd64 verification-native/desktop
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: vortex-isolation-${{ runner.os }}-desktop
          path: verification-native/
          retention-days: 7
          if-no-files-found: error
  macos:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: Swift native build and regression tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p verification-native
          swift test --package-path app -j 2 2>&1 | tee verification-native/swift-tests.log
      - name: Compile universal native application
        shell: bash
        run: |
          set -euo pipefail
          swift build --package-path app -c release --arch arm64 --arch x86_64 -j 2
          bin="$(swift build --package-path app -c release --arch arm64 --arch x86_64 -j 2 --show-bin-path)"
          cp "$bin/Vortex" verification-native/Vortex
          lipo -verify_arch arm64 x86_64 verification-native/Vortex
          git rev-parse HEAD > verification-native/COMMIT.txt
      - name: Compile matching Mac helpers
        shell: bash
        env:
          VORTEX_VERSION: '2.12.1'
        run: |
          set -euo pipefail
          for arch in arm64 amd64; do
            out="$PWD/verification-native/darwin-$arch"
            mkdir -p "$out"
            (cd bases && CGO_ENABLED=0 GOOS=darwin GOARCH="$arch" go build -buildvcs=false -trimpath -ldflags='-s -w' -o "$out/vortex-base" .)
            bash scripts/build-desktop-with-helper.sh darwin "$arch" "$out/desktop"
            cp "$out/desktop/vortex-darwin-$arch" "$out/vortex-phone"
            cp "$out/desktop/redx-verify" "$out/redx-verify"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vortex-isolation-macos-native
          path: verification-native/
          retention-days: 7
          if-no-files-found: error
