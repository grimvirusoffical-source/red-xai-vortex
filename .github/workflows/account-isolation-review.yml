name: Account isolation repair validation
on:
  push:
    branches: [fix/account-isolation-mcp-20261028]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: |
          mkdir -p review
          git archive --format=tar HEAD -o review/vortex-source.tar
          git rev-parse HEAD > review/COMMIT.txt
          sha256sum review/vortex-source.tar > review/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: vortex-account-isolation-source
          path: review/
          retention-days: 2
          if-no-files-found: error
