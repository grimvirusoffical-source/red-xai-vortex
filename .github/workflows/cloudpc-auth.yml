name: Cloud PC authorization regression

on:
  pull_request:
    paths:
      - 'server/cloudpc/**'
      - '.github/workflows/cloudpc-auth.yml'
  push:
    branches: ['main', 'codex/cloudpc-auth-boundaries']
    paths:
      - 'server/cloudpc/**'
      - '.github/workflows/cloudpc-auth.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloudpc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server/cloudpc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: Authorization and proxy regression tests with race detection
        run: go test -race -count=1 -timeout=60s ./...
      - name: Build Cloud PC server
        run: go build ./...
