name: Vortex desktop regression

on:
  pull_request:
  push:
    branches: ['main', 'codex/vortex-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frontend tests
        shell: pwsh
        run: |
          Get-ChildItem desktop/frontend -Filter '*.test.cjs' | ForEach-Object {
            node --test $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Windows Go regression tests
        shell: pwsh
        working-directory: desktop
        run: go test ./... -count=1 -timeout=8m
      - name: Complete native Windows build
        shell: bash
        run: |
          VORTEX_VERSION=2.11.4 bash scripts/build-desktop-with-helper.sh windows amd64 "$PWD/dist/windows"
          cp -R desktop/frontend dist/windows/frontend
          test -s dist/windows/vortex.exe
          test -s dist/windows/vortex-base.exe
      - name: Run Windows executable and verify login UI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = (Resolve-Path dist/windows).Path
          $log = Join-Path $dir 'boot-stdout.log'
          $errlog = Join-Path $dir 'boot-stderr.log'
          $proc = Start-Process -FilePath (Join-Path $dir 'vortex.exe') -ArgumentList @('-headless','-no-update') -WorkingDirectory $dir -PassThru -RedirectStandardOutput $log -RedirectStandardError $errlog
          try {
            $address = $null
            for ($i=0; $i -lt 70; $i++) {
              Start-Sleep -Milliseconds 350
              if ($proc.HasExited) { throw "Native Windows Vortex exited early: $($proc.ExitCode)" }
              if (Test-Path $log) {
                $output = Get-Content $log -Raw -ErrorAction SilentlyContinue
                if ($output -match 'bridge on (http://127\.0\.0\.1:\d+)') {
                  $address = $Matches[1]
                  break
                }
              }
            }
            if (-not $address) { throw 'Native Vortex bridge did not start' }
            $index = Invoke-WebRequest -Uri $address -TimeoutSec 10 -UseBasicParsing
            $frontend = Invoke-WebRequest -Uri "$address/app.js" -TimeoutSec 10 -UseBasicParsing
            if ($index.StatusCode -ne 200 -or $index.Content -notmatch 'gQuick') { throw 'Quick Login form missing on Windows' }
            if ($frontend.StatusCode -ne 200 -or $frontend.Content -notmatch 'redx.quick.start') { throw 'Quick Login handlers missing on Windows' }
            Write-Host 'NATIVE_WINDOWS_VORTEX_STARTUP_AND_AUTH_CONTROLS_OK'
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }
      - name: Verify fixed Windows default browser launcher (non-headless)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --no-save --ignore-scripts playwright-core@1.56.1
          if ($LASTEXITCODE -ne 0) { throw 'Browser automation setup failed' }
          $folder = (Resolve-Path dist/windows).Path
          $out = Join-Path $folder 'real-launch-stdout.log'
          $errlog = Join-Path $folder 'real-launch-stderr.log'
          $p = Start-Process -FilePath (Join-Path $folder 'vortex.exe') -ArgumentList @('-no-update') -WorkingDirectory $folder -PassThru -RedirectStandardOutput $out -RedirectStandardError $errlog
          try {
            $localURL = $null
            for ($i=0; $i -lt 100; $i++) {
              Start-Sleep -Milliseconds 300
              if ($p.HasExited) { throw "The new Windows binary exited early ($($p.ExitCode))" }
              if (Test-Path $out) {
                $log = Get-Content $out -Raw -ErrorAction SilentlyContinue
                if ($log -match 'bridge on (http://127\.0\.0\.1:\d+)') { $localURL = $Matches[1]; break }
              }
            }
            if (-not $localURL) { throw 'New Windows desktop did not report its local service' }
            Start-Sleep -Seconds 1
            $warnings = if (Test-Path $errlog) { Get-Content $errlog -Raw -ErrorAction SilentlyContinue } else { '' }
            if ($warnings -match 'could not open its default browser') { throw 'ShellExecuteW failed to open Windows default browser' }
            node scripts/windows-browser-e2e.cjs $localURL
            if ($LASTEXITCODE -ne 0) { throw 'Built Windows app could not complete real Edge Quick Login startup' }
            node scripts/windows-auth-choice-e2e.cjs $localURL
            if ($LASTEXITCODE -ne 0) { throw 'Quick and password login are not independent, user was required to authenticate twice' }
          } finally {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-quicklogin-smoke
          path: |
            dist/windows/vortex.exe
            dist/windows/vortex-base.exe
            dist/windows/boot-stdout.log
            dist/windows/boot-stderr.log
          if-no-files-found: warn
          retention-days: 7

  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Swift native app tests
        run: swift test --package-path app -j 2

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Go regression tests
        working-directory: desktop
        run: go test ./... -count=1 -timeout=8m
      - name: Gateway tier authorization regression tests (public crypto-independent subset)
        working-directory: gateway
        # The full gateway suite depends on the separately shipped, private
        # Red-SecretsXAI crypto backend. Never disable crypto to run it in CI.
        run: go test ./... -run '^TestVortexTier' -count=1 -timeout=8m
      - name: Frontend tests
        run: node --test desktop/frontend/*.test.cjs
      - name: Validate official release publisher script
        run: bash -n scripts/publish-vortex-release.sh
      - name: Build Linux package executables
        run: VORTEX_VERSION=2.11.4 bash scripts/build-desktop-with-helper.sh linux amd64 "$PWD/dist/linux"
      - name: Stage complete Linux manual test archive from last verified runtime
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/original-linux dist/linux-test
          gh release download v2.11.3 -R grimvirusoffical-source/red-xai-vortex -D dist/original-linux \
            -p Red-XAI-Vortex-linux-amd64.tar.gz -p release-manifest.json -p release-manifest.sig
          (cd desktop && go run ./cmd/redx-verify \
            ../dist/original-linux/release-manifest.json ../dist/original-linux/release-manifest.sig \
            ../dist/original-linux/Red-XAI-Vortex-linux-amd64.tar.gz)
          tar -xzf dist/original-linux/Red-XAI-Vortex-linux-amd64.tar.gz -C dist/linux-test
          cp dist/linux/vortex-linux-amd64 dist/linux-test/vortex
          cp dist/linux/vortex-linux-amd64 dist/linux-test/vortex-linux-amd64
          cp dist/linux/vortex-base dist/linux-test/vortex-base
          cp -a desktop/frontend/. dist/linux-test/frontend/
          test -s dist/linux-test/redx-link
          test -d dist/linux-test/rsx-runtime
          test -s dist/linux-test/vortex
          echo 'Vortex 2.11.4 MANUAL TEST ONLY. This modified archive is not signed by the official updater key. Never disable OS security checks; it is not an automatic update.' > dist/linux-test/README-LINUX-TEST-UNSIGNED.txt
          tar -czf dist/Vortex-2.11.4-linux-amd64-TEST-UNSIGNED.tar.gz -C dist/linux-test .
          sha256sum dist/Vortex-2.11.4-linux-amd64-TEST-UNSIGNED.tar.gz
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: Vortex-Linux-2.11.4-MANUAL-TEST-NOT-STABLE
          path: dist/Vortex-2.11.4-linux-amd64-TEST-UNSIGNED.tar.gz
          retention-days: 7
          if-no-files-found: error

  published-windows-real-browser:
    name: Published Windows 2.11.3 browser + login (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download the actual published 2.11.3 Windows ZIP and signed manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist/published | Out-Null
          gh release download v2.11.3 -R grimvirusoffical-source/red-xai-vortex -D dist/published -p 'Red-XAI-Vortex-windows-amd64.zip' -p 'release-manifest.json' -p 'release-manifest.sig'
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch the published Vortex ZIP' }
          $root = (Resolve-Path dist/published).Path
          Push-Location desktop
          try {
            go run ./cmd/redx-verify (Join-Path $root 'release-manifest.json') (Join-Path $root 'release-manifest.sig') (Join-Path $root 'Red-XAI-Vortex-windows-amd64.zip')
            if ($LASTEXITCODE -ne 0) { throw 'The official Windows archive signature did not verify' }
          } finally { Pop-Location }
          Expand-Archive -Path (Join-Path $root 'Red-XAI-Vortex-windows-amd64.zip') -DestinationPath dist/published/app
          foreach ($file in @('vortex.exe','vortex-base.exe','redx-link.exe','frontend/index.html','frontend/app.js')) {
            if (-not (Test-Path (Join-Path 'dist/published/app' $file))) { throw "Required installed asset missing: $file" }
          }
          $signature = Get-AuthenticodeSignature 'dist/published/app/vortex.exe'
          Write-Host "WINDOWS_BINARY_AUTHENTICODE_STATUS $($signature.Status)"
      - name: Install browser automation using built-in Microsoft Edge
        shell: pwsh
        run: npm install --no-save --ignore-scripts playwright-core@1.56.1
      - name: Launch full desktop and click through live Red-XAI Quick Login
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = (Resolve-Path 'dist/published/app').Path
          $stdout = Join-Path $folder 'vortex-windows-boot.log'
          $stderr = Join-Path $folder 'vortex-windows-errors.log'
          $exe = Join-Path $folder 'vortex.exe'
          # Real user mode: no -headless. The former startup test bypassed this.
          $proc = Start-Process -FilePath $exe -ArgumentList @('-no-update') -WorkingDirectory $folder -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $address = $null
            for ($i=0; $i -lt 100; $i++) {
              Start-Sleep -Milliseconds 350
              if ($proc.HasExited) { throw "Released Vortex.exe exited early with code $($proc.ExitCode)" }
              if (Test-Path $stdout) {
                $output = Get-Content $stdout -Raw -ErrorAction SilentlyContinue
                if ($output -match 'bridge on (http://127\.0\.0\.1:\d+)') {
                  $address = $Matches[1]
                  break
                }
              }
            }
            if (-not $address) { throw 'Released desktop did not start its local service' }
            node scripts/windows-browser-e2e.cjs $address
            if ($LASTEXITCODE -ne 0) { throw 'Real browser Quick Login integration failed' }
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }
      - name: Attach sanitized boot diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-win-login-${{ matrix.os }}
          path: |
            dist/published/app/vortex-windows-boot.log
            dist/published/app/vortex-windows-errors.log
          if-no-files-found: warn
          retention-days: 5
